name: Source and physics checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/audit.txt
      - run: python -m pip install -r requirements/audit.txt
      - run: python scripts/check_release.py
      - run: python scripts/verify_results.py
      - run: python -m unittest experiments.closed_chain_eval.test_core experiments.closed_chain_eval.test_continuous experiments.closed_chain_eval.test_instrument_optimization experiments.closed_chain_eval.test_visual_calibration -v
      - run: python experiments/fourbar/test_mechanics.py
      - run: python -m unittest discover -s tests -v
